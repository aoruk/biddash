<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidDash - AI提案文爆速生成ツール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- ヘッダー -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white font-black px-3 py-1 rounded text-xl tracking-wider">BidDash</div>
            <span class="text-xs bg-gray-800 text-gray-400 px-2 py-1 rounded border border-gray-750">v1.0.0 Pro</span>
        </div>
        <div class="text-sm text-gray-400">Partner Mode: Active</div>
    </header>

    <!-- メインコンテンツ（2カラムレイアウト） -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- 左側：入力コントロールパネル -->
        <section class="bg-gray-800/50 border border-gray-700/60 rounded-2xl p-6 space-y-6 backdrop-blur">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-5 bg-blue-500 rounded-full"></div>
                <h2 class="text-lg font-bold tracking-wide">案件パラメーター入力</h2>
            </div>

            <!-- 案件情報の入力欄 -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">1. クライアントの募集文 / 要件</label>
                <textarea id="job-description" rows="8" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-sm text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-500" placeholder="クラウドワークスなどの募集文をここに丸ごとコピペしてください..."></textarea>
            </div>

            <!-- アピールスキルの選択欄 -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">2. 今回アピールする自分の武器</label>
                <textarea id="my-skills" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-sm text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-500" placeholder="例: HTML/CSS, Tailwind CSS, 迅速なレスポンス、丁寧なヒアリングなど"></textarea>
            </div>

            <!-- 生成ボタン -->
            <button id="generate-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-blue-900/30 transform active:scale-[0.98] transition duration-150 flex items-center justify-center space-x-2 text-base">
                <span>🚀 提案文を爆速で生成する</span>
            </button>
        </section>

        <!-- 右側：出力ディスプレイ -->
        <section class="bg-gray-800/30 border border-gray-700/40 rounded-2xl p-6 flex flex-col min-h-[500px]">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-5 bg-emerald-500 rounded-full"></div>
                    <h2 class="text-lg font-bold tracking-wide">生成された最強の提案書</h2>
                </div>
                <!-- コピペボタン（今は見た目だけ） -->
                <button id="copy-btn" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                    <span>📋 コピーする</span>
                </button>
            </div>

            <!-- AIの出力結果が入るエリア -->
            <div class="flex-1 bg-gray-900/60 border border-gray-800 rounded-xl p-5 text-sm leading-relaxed text-gray-300 overflow-y-auto min-h-[300px]" id="output-text">
                <p class="text-gray-500 italic text-center pt-20">左側を入力してボタンを押すと、ここにクライアントの心を掴む提案文が爆速で生成されます。</p>
            </div>
        </section>

    </main>

    <!-- JavaScript用のファイルを読み込む準備（次のステップで使用） -->
    <script>
const generateBtn = document.getElementById('generate-btn');
const jobDescription = document.getElementById('job-description');
const mySkills = document.getElementById('my-skills');
const outputText = document.getElementById('output-text');

generateBtn.addEventListener('click', async () => {
    const jobText = jobDescription.value.trim();
    const skillText = mySkills.value.trim();

    if (!jobText || !skillText) {
        alert('案件募集文とアピールスキルの両方を入力してください！');
        return;
    }

    generateBtn.disabled = true;
    generateBtn.innerHTML = `<span>⏳ 提案文を爆速で錬成中...</span>`;
    outputText.innerHTML = `<p class="text-gray-400 italic text-center pt-20">AIが案件を分析し、最強の提案文を執筆しています。少々お待ちください...</p>`;

    try {
        const response = await fetch('http://localhost:3000/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ job: jobText, skills: skillText })
        });

        const data = await response.json();
        
        // OpenAI側でエラー（400番や401番など）が起きていた場合の処理
        if (!response.ok) {
            const errorMsg = data.error ? data.error.message : 'OpenAI側でエラーが発生しました。';
            throw new Error(errorMsg);
        }

        const aiReply = data.choices[0].message.content;

        outputText.innerHTML = `
            <div class="space-y-4">
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-850 whitespace-pre-wrap text-gray-200 select-text">
                    ${aiReply}
                </div>
            </div>
        `;

    } catch (error) {
        console.error(error);
        outputText.innerHTML = `
            <div class="text-red-400 p-4 bg-red-950/30 border border-red-900 rounded-xl">
                <p class="font-bold">⚠️ OpenAIエラーが発生しました</p>
                <p class="text-sm mt-2 font-mono bg-black/40 p-2 rounded border border-red-900/55">${error.message}</p>
                <p class="text-xs mt-3 text-gray-400">※APIキーが正しいか、またはアカウントの残高（Credit）があるか確認してください。</p>
            </div>
        `;
    } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = `<span>🚀 提案文を爆速で生成する</span>`;
    }
});
    </script>
</body>
</html>
