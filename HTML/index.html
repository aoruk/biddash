<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidDash v2.7.5 - Perfect Multi-Matrix Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-button {
            position: relative;
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-blue-500/30 antialiased">

    <header class="border-b border-slate-800/60 sticky top-0 bg-slate-950/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-blue-400 via-indigo-400 to-cyan-400 bg-clip-text text-transparent">BidDash</span>
                <span class="text-xs font-mono px-2 py-0.5 bg-slate-800 rounded-full text-slate-400 border border-slate-700">2.7.5</span>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="menu-btn" class="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg border border-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="relative">
                    <select id="user-lang-select" class="appearance-none bg-slate-900 border border-slate-700 text-sm rounded-lg pl-3 pr-8 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-200 cursor-pointer">
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="en">🇺🇸 English</option>
                        <option value="zh">🇨🇳 中文</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-5 flex flex-col gap-6">
                
                <div class="glass-panel rounded-2xl p-6 flex flex-col gap-4">
                    <div class="flex items-center justify-between">
                        <h2 id="lbl-job-desc" class="text-sm font-semibold tracking-wide text-slate-400">1. 案件募集文 / 受信メッセージ</h2>
                        <span id="match-status" class="hidden text-xs font-bold px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full animate-pulse"></span>
                    </div>
                    <textarea id="job-description" class="w-full h-40 bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition resize-none" placeholder="ターゲットのメッセージを貼り付けてください..."></textarea>
                    
                    <div id="quick-analysis-panel" class="hidden border-t border-slate-800/60 pt-4 flex flex-col gap-2">
                        <h3 id="lbl-quick-analysis" class="text-xs font-bold tracking-wider text-blue-400 uppercase">クイック解釈（自国語への翻訳）</h3>
                        <div id="job-translation-text" class="text-xs text-slate-400 leading-relaxed bg-slate-950/40 p-3 rounded-lg border border-slate-900 min-h-[40px] flex items-center"></div>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl p-4 flex flex-col gap-2">
                    <button id="toggle-db-btn" class="w-full flex items-center justify-between p-2 text-slate-300 hover:text-slate-100 font-medium text-sm transition">
                        <span id="lbl-skill-db">スキルデータベース（選択・追加・削除）</span>
                        <svg id="arrow-icon" class="w-4 h-4 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    
                    <div id="db-content" class="hidden pt-2 border-t border-slate-800/60 flex flex-col gap-4">
                        <div class="flex border-b border-slate-800">
                            <button id="tab-list-btn" class="px-4 py-2 text-xs font-bold border-b-2 border-blue-500 text-blue-400 cursor-pointer">資産一覧</button>
                            <button id="tab-add-btn" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-400 cursor-pointer">+ 新規追加フォーム</button>
                        </div>
                        
                        <div id="panel-list-view" class="flex flex-col gap-3">
                            <div id="skill-list-view" class="flex flex-col gap-3 max-h-64 overflow-y-auto pr-1"></div>
                            <p id="lbl-no-match" class="hidden text-xs text-slate-500 italic px-2">登録されているスキル資産がありません。</p>
                        </div>

                        <div id="panel-add-view" class="hidden flex flex-col gap-3 p-1 bg-slate-900/40 rounded-xl border border-slate-900">
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-400">スキル名 (例: React)</label>
                                <input type="text" id="new-skill-name" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500" placeholder="スキル名を入力...">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-400">実績・アピール文（日本語でOK）</label>
                                <textarea id="new-skill-achievement" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 h-16 resize-none focus:outline-none focus:border-blue-500" placeholder="Hooksを用いたSPA開発が可能です..."></textarea>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-400">自動マッチング用キーワード (カンマ区切り)</label>
                                <input type="text" id="new-skill-keywords" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500" placeholder="react, spa">
                            </div>
                            <button id="add-skill-submit" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-lg transition mt-1">データベースに保存</button>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl p-6 flex flex-col gap-4">
                    <h2 id="lbl-strategy" class="text-sm font-semibold tracking-wide text-slate-400">2. 戦略 / カスタム追加機能（生い立ち・経験・熱意など）</h2>
                    <textarea id="strategy-input" class="w-full h-32 bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition resize-none" placeholder="自国語で思いのままに入力してください..."></textarea>
                </div>

                <button id="generate-btn" class="glow-button w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-950/50 flex items-center justify-center gap-2 cursor-pointer border border-blue-400/20">
                    <span id="lbl-btn-generate">提案書を即座に作成</span>
                </button>

            </div>

            <div class="lg:col-span-7 flex flex-col">
                <div class="glass-panel rounded-2xl p-6 flex flex-col gap-4 h-full min-h-[640px]">
                    <div class="flex items-center justify-between border-b border-slate-800/60 pb-4">
                        <h2 id="lbl-output-title" class="text-sm font-bold tracking-wide text-slate-300">生成された最強の提案書</h2>
                        <button id="copy-btn" class="hidden text-xs font-bold px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition shadow-md shadow-blue-950/30">クリップボードにコピー</button>
                    </div>
                    
                    <div class="flex-1 flex flex-col justify-center relative min-h-[400px]">
                        <div id="output-placeholder" class="text-center flex flex-col items-center gap-3">
                            <div id="loading-spinner" class="hidden w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                            <p id="lbl-placeholder-text" class="text-sm text-slate-500 font-medium">入力パラメータをお待ちしています...</p>
                        </div>
                        <div id="output-text" class="hidden text-sm text-slate-300 leading-relaxed whitespace-pre-wrap font-sans overflow-y-auto max-h-[560px] pr-2"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="history-sidebar" class="fixed inset-y-0 right-0 w-80 bg-slate-900/95 border-l border-slate-800 transform translate-x-full transition-transform duration-300 z-50 shadow-2xl p-6 flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <h3 id="lbl-history-title" class="font-bold text-slate-200">提案生成履歴</h3>
            <button id="close-menu-btn" class="text-slate-400 hover:text-slate-200">✕</button>
        </div>
        <div id="history-list-container" class="flex-1 overflow-y-auto flex flex-col gap-2 text-xs text-slate-400"></div>
    </div>

    <script>
        const i18n = {
            ja: {
                "lbl-job-desc": "1. 案件募集文 / 受信メッセージ",
                "job-description-placeholder": "ターゲットのメッセージを貼り付けてください...",
                "lbl-quick-analysis": "クイック解釈（自国語への翻訳）",
                "lbl-skill-db": "スキルデータベース（選択・追加・削除）",
                "lbl-strategy": "2. 戦略 / カスタム追加機能（生い立ち・経験・熱意など）",
                "lbl-btn-generate": "提案書を即座に作成",
                "lbl-output-title": "生成された最強の提案書",
                "lbl-placeholder-text": "入力パラメータをお待ちしています...",
                "lbl-history-title": "提案生成履歴",
                "badge-match": "つの資産が今回の案件に自動適合しました。",
                "loading-text": "AIが多言語マトリクスを計算して最適な提案書を錬成中...",
                "copy-btn-text": "クリップボードにコピー",
                "translating-badge": "翻訳を取得中..."
            },
            en: {
                "lbl-job-desc": "1. Job Description / Received Message",
                "job-description-placeholder": "Paste the client's job description here...",
                "lbl-quick-analysis": "Quick Interpretation (Translation to Native)",
                "lbl-skill-db": "Skill Database (Select/Add/Delete)",
                "lbl-strategy": "2. Strategy / Custom Additions (Background, Story, Passion)",
                "lbl-btn-generate": "Generate Proposal Immediately",
                "lbl-output-title": "Generated Prime Proposal",
                "lbl-placeholder-text": "Waiting for input parameters...",
                "lbl-history-title": "Proposal Generation History",
                "badge-match": " asset(s) automatically matched this project.",
                "loading-text": "Computing language matrix to formulate optimal proposal...",
                "copy-btn-text": "Copy to Clipboard",
                "translating-badge": "Translating..."
            },
            zh: {
                "lbl-job-desc": "1. 客户需求描述 / 收到消息",
                "job-description-placeholder": "请在此处粘贴客户的需求内容...",
                "lbl-quick-analysis": "快速解析（翻译为自国语）",
                "lbl-skill-db": "技能数据资产库（选择 / 添加 / 删除）",
                "lbl-strategy": "2. 谈判策略 / 自定义附加条件（生い立ち・経験・熱意など）",
                "lbl-btn-generate": "立即高速生成提案",
                "lbl-output-title": "已生成的顶级提案书",
                "lbl-placeholder-text": "正在等待输入参数...",
                "lbl-history-title": "提案生成历史纪录",
                "badge-match": "个核心资产已自动适配此项目。",
                "loading-text": "AI矩阵正在精炼出最适合该国客户的提案书...",
                "copy-btn-text": "复制到剪贴板",
                "translating-badge": "正在获取翻译..."
            }
        };

        let currentLang = 'ja';
        let skillDatabase = [];
        let typingTimer;

        const langSelect = document.getElementById('user-lang-select');
        const jobDescInput = document.getElementById('job-description');
        const strategyInput = document.getElementById('strategy-input');
        const matchStatusBadge = document.getElementById('match-status');
        const skillListView = document.getElementById('skill-list-view');
        const outPlaceholder = document.getElementById('output-placeholder');
        const loadingSpinner = document.getElementById('loading-spinner');
        const outText = document.getElementById('output-text');
        const copyBtn = document.getElementById('copy-btn');
        const quickAnalysisPanel = document.getElementById('quick-analysis-panel');
        const jobTranslationText = document.getElementById('job-translation-text');
        
        const tabListBtn = document.getElementById('tab-list-btn');
        const tabAddBtn = document.getElementById('tab-add-btn');
        const panelListView = document.getElementById('panel-list-view');
        const panelAddView = document.getElementById('panel-add-view');
        const lblNoMatch = document.getElementById('lbl-no-match');

        function initSkills() {
            const localData = localStorage.getItem('biddash_skills_v3');
            if (localData) {
                skillDatabase = JSON.parse(localData);
            } else {
                skillDatabase = [
                    { id: "s1", name: "React", keywords: ["react"], achievement: "コンポーネント設計・Hooksを用いた開発が可能です。", checked: true },
                    { id: "s2", name: "Tailwind CSS", keywords: ["tailwind", "css", "responsive"], achievement: "モバイルファーストのレスポンシブUIを高速で構築できます。", checked: true },
                    { id: "s3", name: "Git", keywords: ["git", "github"], achievement: "GitHubを用いたソースコード管理と個人ポートフォリオの公開経験があります。", checked: true }
                ];
                localStorage.setItem('biddash_skills_v3', JSON.stringify(skillDatabase));
            }
            renderSkills();
        }

        function renderSkills() {
            skillListView.innerHTML = '';
            if (skillDatabase.length === 0) {
                lblNoMatch.classList.remove('hidden');
                return;
            } else {
                lblNoMatch.classList.add('hidden');
            }

            skillDatabase.forEach((skill, index) => {
                const card = document.createElement('div');
                card.className = `p-3 border rounded-xl flex flex-col gap-1.5 text-xs transition ${
                    skill.checked ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-950/20 border-slate-900 opacity-50'
                }`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between font-bold">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" data-index="${index}" ${skill.checked ? 'checked' : ''} class="skill-checkbox w-4 h-4 rounded text-blue-600 bg-slate-950 border-slate-800 focus:ring-blue-500 cursor-pointer">
                            <span class="text-slate-200 text-sm">${skill.name}</span>
                        </div>
                        <button data-index="${index}" class="skill-delete-btn text-slate-500 hover:text-rose-400 font-bold px-1 transition text-sm cursor-pointer">✕</button>
                    </div>
                    <div class="text-slate-400 text-[11px] leading-relaxed ml-6">${skill.achievement}</div>
                    <div class="flex flex-wrap gap-1 mt-1 ml-6">
                        ${skill.keywords.map(kw => `<span class="px-1.5 py-0.5 bg-blue-950/40 text-blue-400 border border-blue-900/40 rounded text-[10px]">${kw}</span>`).join('')}
                    </div>
                `;
                skillListView.appendChild(card);
            });

            document.querySelectorAll('.skill-checkbox').forEach(cb => cb.addEventListener('change', toggleSkillCheck));
            document.querySelectorAll('.skill-delete-btn').forEach(btn => btn.addEventListener('click', deleteSkill));
        }

        function toggleSkillCheck(e) {
            const index = e.target.getAttribute('data-index');
            skillDatabase[index].checked = e.target.checked;
            localStorage.setItem('biddash_skills_v3', JSON.stringify(skillDatabase));
            renderSkills();
            triggerRealtimeMatching();
        }

        function deleteSkill(e) {
            const index = e.target.getAttribute('data-index');
            if (confirm(`スキル「${skillDatabase[index].name}」を削除してもよろしいですか？`)) {
                skillDatabase.splice(index, 1);
                localStorage.setItem('biddash_skills_v3', JSON.stringify(skillDatabase));
                renderSkills();
                triggerRealtimeMatching();
            }
        }

        document.getElementById('add-skill-submit').addEventListener('click', () => {
            const name = document.getElementById('new-skill-name').value.trim();
            const achievement = document.getElementById('new-skill-achievement').value.trim();
            const kwInput = document.getElementById('new-skill-keywords').value.trim();

            if (!name || !achievement) return alert('スキル名と実績・アピール文は必須です。');
            const keywords = kwInput ? kwInput.split(',').map(k => k.trim()).filter(k => k) : [name.toLowerCase()];

            skillDatabase.push({ id: "s_" + Date.now(), name: name, achievement: achievement, keywords: keywords, checked: true });
            localStorage.setItem('biddash_skills_v3', JSON.stringify(skillDatabase));
            
            document.getElementById('new-skill-name').value = '';
            document.getElementById('new-skill-achievement').value = '';
            document.getElementById('new-skill-keywords').value = '';

            switchTab('list');
            renderSkills();
            triggerRealtimeMatching();
        });

        function switchTab(tab) {
            if (tab === 'list') {
                tabListBtn.className = "px-4 py-2 text-xs font-bold border-b-2 border-blue-500 text-blue-400 cursor-pointer";
                tabAddBtn.className = "px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-400 cursor-pointer";
                panelListView.classList.remove('hidden');
                panelAddView.classList.add('hidden');
            } else {
                tabAddBtn.className = "px-4 py-2 text-xs font-bold border-b-2 border-blue-500 text-blue-400 cursor-pointer";
                tabListBtn.className = "px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-400 cursor-pointer";
                panelAddView.classList.remove('hidden');
                panelListView.classList.add('hidden');
            }
        }
        tabListBtn.addEventListener('click', () => switchTab('list'));
        tabAddBtn.addEventListener('click', () => switchTab('add'));

        async function applyLanguageAndTranslation(targetLang) {
            currentLang = targetLang;
            const dict = i18n[targetLang];

            document.getElementById('lbl-job-desc').childNodes[0].textContent = dict["lbl-job-desc"];
            jobDescInput.placeholder = dict["job-description-placeholder"];
            document.getElementById('lbl-quick-analysis').textContent = dict["lbl-quick-analysis"];
            document.getElementById('lbl-skill-db').querySelector('span').textContent = dict["lbl-skill-db"];
            document.getElementById('lbl-strategy').textContent = dict["lbl-strategy"];
            document.getElementById('lbl-btn-generate').querySelector('span').textContent = dict["lbl-btn-generate"];
            document.getElementById('lbl-output-title').textContent = dict["lbl-output-title"];
            document.getElementById('lbl-placeholder-text').textContent = (loadingSpinner.classList.contains('hidden')) ? dict["lbl-placeholder-text"] : dict["loading-text"];
            document.getElementById('lbl-history-title').textContent = dict["lbl-history-title"];
            copyBtn.textContent = dict["copy-btn-text"];

            triggerRealtimeMatching();
            if (jobDescInput.value.trim()) requestJobTranslation();
        }

        function handleJobDescInput() {
            triggerRealtimeMatching();
            clearTimeout(typingTimer);
            if (jobDescInput.value.trim()) {
                typingTimer = setTimeout(requestJobTranslation, 800);
            } else {
                quickAnalysisPanel.classList.add('hidden');
                jobTranslationText.textContent = '';
            }
        }

        function triggerRealtimeMatching() {
            const text = jobDescInput.value.toLowerCase();
            if (!text) {
                matchStatusBadge.classList.add('hidden');
                return;
            }

            let matchCount = 0;
            skillDatabase.forEach(skill => {
                if (skill.checked) {
                    const hasMatch = skill.keywords.some(kw => text.includes(kw.toLowerCase()));
                    if (hasMatch) matchCount++;
                }
            });

            if (matchCount > 0) {
                matchStatusBadge.textContent = `✔ ${matchCount}${i18n[currentLang]["badge-match"]}`;
                matchStatusBadge.classList.remove('hidden');
            } else {
                matchStatusBadge.classList.add('hidden');
            }
        }

        // 🌟 クイック翻訳要求時にも userLanguage を含めるように強化！
        async function requestJobTranslation() {
            const textToTranslate = jobDescInput.value.trim();
            if (!textToTranslate) return;

            quickAnalysisPanel.classList.remove('hidden');
            jobTranslationText.innerHTML = `<span class="text-slate-500 animate-pulse">${i18n[currentLang]["translating-badge"]}</span>`;

            try {
                const response = await fetch('http://localhost:3000/translate-text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: textToTranslate,
                        userLanguage: currentLang // ★自国語をセット
                    })
                });

                if (!response.ok) throw new Error('Translation API error');
                const data = await response.json();
                
                // もし「(翻訳不要)」フラグが返ってきたら、パネルごと非表示にするスマート制御
                if (data.translatedText.includes("(翻訳不要") || data.translatedText.includes("Same Language")) {
                    quickAnalysisPanel.classList.add('hidden');
                    jobTranslationText.textContent = '';
                } else {
                    jobTranslationText.textContent = data.translatedText;
                }

            } catch (err) {
                jobTranslationText.textContent = "（自動翻訳サーバーエラー）";
            }
        }

        async function generateProposal() {
            const jobText = jobDescInput.value.trim();
            const strategyText = strategyInput.value.trim();
            if (!jobText) return alert('案件募集文を入力してください。');

            outText.classList.add('hidden');
            copyBtn.classList.add('hidden');
            outPlaceholder.classList.remove('hidden');
            loadingSpinner.classList.remove('hidden');
            document.getElementById('lbl-placeholder-text').textContent = i18n[currentLang]["loading-text"];

            const activeSkills = skillDatabase.filter(skill => skill.checked);

            try {
                const response = await fetch('http://localhost:3000/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jobDescription: jobText,
                        strategy: strategyText,
                        skills: activeSkills,
                        userLanguage: currentLang
                    })
                });

                if (!response.ok) throw new Error('Generation failed');
                const data = await response.json();

                loadingSpinner.classList.add('hidden');
                outPlaceholder.classList.add('hidden');
                outText.classList.remove('hidden');
                copyBtn.classList.remove('hidden');
                
                outText.textContent = data.proposal;
                saveToHistory(jobText, data.proposal);

            } catch (err) {
                loadingSpinner.classList.add('hidden');
                document.getElementById('lbl-placeholder-text').textContent = "生成エラーが発生しました。バックエンドの接続を確認してください。";
            }
        }

        function saveToHistory(job, result) {
            let history = JSON.parse(localStorage.getItem('biddash_history_v2')) || [];
            history.unshift({ time: new Date().toLocaleString(), job: job.substring(0, 30) + '...', result: result });
            if (history.length > 10) history.pop();
            localStorage.setItem('biddash_history_v2', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list-container');
            const history = JSON.parse(localStorage.getItem('biddash_history_v2')) || [];
            container.innerHTML = history.length ? '' : '履歴はありません。';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'p-2 bg-slate-950 border border-slate-800 rounded-lg hover:border-slate-700 cursor-pointer transition';
                div.innerHTML = `
                    <div class="text-[10px] text-slate-500 font-mono">${item.time}</div>
                    <div class="font-medium text-slate-300 truncate">${item.job}</div>
                `;
                container.appendChild(div);
            });
        }

        langSelect.addEventListener('change', (e) => applyLanguageAndTranslation(e.target.value));
        jobDescInput.addEventListener('input', handleJobDescInput);
        document.getElementById('generate-btn').addEventListener('click', generateProposal);
        
        document.getElementById('toggle-db-btn').addEventListener('click', () => {
            document.getElementById('db-content').classList.toggle('hidden');
            document.getElementById('arrow-icon').classList.toggle('rotate-180');
        });

        document.getElementById('menu-btn').addEventListener('click', () => document.getElementById('history-sidebar').classList.remove('translate-x-full'));
        document.getElementById('close-menu-btn').addEventListener('click', () => document.getElementById('history-sidebar').classList.add('translate-x-full'));

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(outText.textContent);
            alert('コピーしました！');
        });

        window.onload = () => {
            initSkills();
            renderHistory();
        };
    </script>
</body>
</html>
